name: Create APK from Master

on:
  push:
    branches:
      - master

jobs:
  # Record the "latest-master" APK's download count before it is replaced
  # (re-uploading an asset resets its counter).
  snapshot:
    permissions:
      contents: write
    uses: ./.github/workflows/stats.yml
    secrets: inherit

  build:
    needs: snapshot
    # A failed snapshot must never block a release.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'jetbrains'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleFreeDebug

      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ github.token }}"
          automatic_release_tag: "latest-master"
          prerelease: true
          title: "Latest Master Build"
          files: app/build/outputs/apk/free/debug/*.apk
